<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת שמירה בהטמעה</title>
<style>
  body{margin:0;font-family:"Heebo",system-ui,sans-serif;background:#13070C;color:#F6F0E6;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
  .box{max-width:380px}
  h1{font-size:19px;margin:0 0 14px;font-weight:700}
  .verdict{font-size:17px;font-weight:800;padding:14px;border-radius:8px;margin:0 0 14px;line-height:1.5}
  .ok{background:rgba(80,200,120,.16);border:1px solid rgba(80,200,120,.5);color:#8ee5ab}
  .bad{background:rgba(220,80,100,.16);border:1px solid rgba(220,80,100,.5);color:#f09aa8}
  pre{text-align:left;direction:ltr;font-size:11.5px;background:rgba(255,255,255,.05);
      border:1px solid rgba(198,164,91,.25);border-radius:6px;padding:11px;overflow:auto;color:#B9AAA8}
  p{font-size:13px;color:#B9AAA8;line-height:1.6}
</style>
</head>
<body>
<div class="box">
  <h1>בדיקת שמירה מקומית בתוך הטמעה</h1>
  <div class="verdict" id="verdict">בודק…</div>
  <pre id="detail"></pre>
  <p id="note"></p>
</div>
<script>
const KEY = 'al_oto_gal_embed_probe';
const r = { embedded: window.self !== window.top, origin: location.origin, ts: Date.now() };

// 1. כתיבה וקריאה
try {
  localStorage.setItem(KEY, 'v1-' + r.ts);
  r.wrote = localStorage.getItem(KEY) === 'v1-' + r.ts;
} catch (e) { r.wrote = false; r.writeError = e.name + ': ' + e.message; }

// 2. האם נתון קודם שרד בין טעינות (זה מה שבאמת חשוב למשחק)
try { r.previous = localStorage.getItem(KEY + '_persist') || null;
      localStorage.setItem(KEY + '_persist', 'seen-' + r.ts); }
catch (e) { r.previous = 'ERROR'; }

// 3. המפתח האמיתי של המשחק
try { r.gameKey = localStorage.getItem('al_oto_gal_couple_memory_v3') ? 'קיים' : 'ריק'; }
catch (e) { r.gameKey = 'חסום'; }

// 4. גישת אחסון מורחבת (Storage Access API)
r.hasStorageAccessAPI = typeof document.hasStorageAccess === 'function';
if (r.hasStorageAccessAPI) {
  document.hasStorageAccess().then(v => { r.hasStorageAccess = v; report(); }).catch(()=>{ report(); });
}

function report(){
  const ok = r.wrote === true;
  const v = document.getElementById('verdict');
  v.className = 'verdict ' + (ok ? 'ok' : 'bad');
  v.textContent = ok
    ? (r.embedded ? '✓ השמירה עובדת גם בתוך ההטמעה' : '✓ השמירה עובדת (לא בהטמעה)')
    : '✗ הדפדפן חוסם שמירה מקומית כאן';
  document.getElementById('detail').textContent = JSON.stringify(r, null, 2);
  document.getElementById('note').textContent = ok
    ? 'ההתקדמות, המועדפים והשמות יישמרו בין ערבים.'
    : 'במצב הזה המשחק יעבוד אבל לא יזכור כלום בין ערבים.';
  try { parent.postMessage({ type: 'al-oto-gal-storage-probe', result: r }, '*'); } catch(e){}
}
if (!r.hasStorageAccessAPI) report();
</script>
</body>
</html>
